<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Álbum Copa 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #FFF7E8;
      color: #1a1a1a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      line-height: 1;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #1FB257;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
    }
    button:active { opacity: 0.85; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📵</div>
    <h1>Sem conexão</h1>
    <p>
      Verifique sua internet e tente novamente.<br />
      Alguns dados podem estar disponíveis em cache.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
